# ============================================================
# 鑫连鑫金属丝网厂 — 后端应用配置
# ============================================================
# 本文件是 xlx-gateway 模块的唯一配置入口，所有模块共享。
# 环境变量覆盖：DB_PASSWORD、JWT_SECRET、UPLOAD_PATH
# ============================================================

# 服务器配置 — 端口 8080，所有 API 路径以 /api 开头
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  # 数据源配置 — MySQL 8.0，数据库名 xlx，UTF-8 编码
  datasource:
    url: jdbc:mysql://localhost:3306/xlx?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 文件上传限制 — 单文件 10MB，单次请求 20MB
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # Flyway 数据库迁移 — 启动时自动执行 db/migration/ 下的 SQL 脚本
  # - enabled: 启用迁移（首次启动自动建表）
  # - baseline-on-migrate: 对已有数据库建立基线（兼容手动建表的情况）
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

# MyBatis Plus ORM 配置
# - 下划线转驼峰：user_name → userName
# - 主键策略：自增
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT 令牌配置 — 用于管理员登录鉴权
# - secret：签名密钥（生产环境务必通过环境变量覆盖）
# - expiration：过期时间 24 小时（毫秒）
jwt:
  secret: ${JWT_SECRET:xlx-jwt-secret-key-change-in-production}
  expiration: 86400000

# CORS 跨域配置 — 生产环境通过环境变量设置实际域名
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# 文件上传配置
# - path：文件存储目录（可通过环境变量覆盖）
# - allowed-types：允许的文件扩展名
# - max-size：单文件大小上限 50MB（字节）
upload:
  path: ${UPLOAD_PATH:./uploads}
  allowed-types: jpg,jpeg,png,gif,webp,pdf,doc,docx,xls,xlsx,txt,mp4,webm,mov
  max-size: 52428800

# 日志配置 — 开发环境输出 debug 级别日志
logging:
  level:
    com.xlx.api: debug
